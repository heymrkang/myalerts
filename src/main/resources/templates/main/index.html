<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myalerts</title>
    <link rel="stylesheet" th:href="@{/main/index.css}">
</head>
<body>
<div class="container">
    <header class="header">
        <h1 class="title">Hello World</h1>
        <p class="subtitle">myalerts</p>
    </header>

    <!-- 1. 로그인 상태 -->
    <div th:if="${user != null}" class="card">
        <div class="user-info">
            <p><strong><span th:text="${user.userId}">user</span></strong> 님, 환영합니다.</p>
            <div class="meta-list">
                <div><span>생성일:</span> <span th:text="${#temporals.format(user.timeCreate, 'yyyy-MM-dd HH:mm')}">-</span></div>
                <div><span>상태:</span> <span class="badge-active">정상 (is_del: N)</span></div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="userId" th:value="${user.userId}">
            <button type="submit" class="btn btn-outline btn-full">로그아웃</button>
        </form>
    </div>

    <!-- 2. 게스트 / 로그인 / 회원가입 -->
    <div th:if="${user == null}" class="card">
        <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">로그인</button>
            <button type="button" class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">회원가입</button>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" name="userId" placeholder="아이디" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPw">비밀번호</label>
                <input type="password" id="loginPw" name="userPw" placeholder="비밀번호" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">로그인</button>
        </form>

        <!-- 회원가입 폼 -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regId">새 아이디</label>
                <input type="text" id="regId" name="userId" placeholder="사용할 아이디" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="regPw">비밀번호</label>
                <input type="password" id="regPw" name="userPw" placeholder="비밀번호" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">가입하기</button>
        </form>

        <div id="authAlert" class="alert hidden"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/main/index.js}"></script>
</body>
</html>
